name: AmazingHand Integration

on:
  push:
    branches: [hardware/amazinghand-so101]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra test --extra feetech
      - run: uv pip install -e submodules/amazinghand_wrapper
      - run: uv pip install 'ruff>=0.14.1,<0.15.0'
      - run: uv run pytest -q tests/robots/test_so100_follower.py tests/robots/test_so101_amazing_follower.py
      - run: uv run ruff check src/lerobot/robots/so101_amazing_follower tests/robots/test_so101_amazing_follower.py
